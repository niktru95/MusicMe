<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Музыкальная теория для гитариста</title>
  <meta name="description" content="Веб-тренажёр музыкальной теории для гитариста: ноты на грифе, интервалы, гаммы, трезвучия, септаккорды, пентатоника и квинтовый круг. 9 тем, 15 задач с аудио.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="logo" id="btn-home" title="На главную">🎸 Музыкальная теория</button>
      <div class="global-progress" id="global-progress"></div>
    </div>
  </header>

  <main>
    <section id="view-home" class="view">
      <h1 class="page-title">Выберите тему</h1>
      <p class="page-subtitle">Ноты на грифе, интервалы, гаммы, аккорды и гармония — тренажёр для гитариста. Некоторые задания можно прослушать 🔊.</p>
      <div class="home-actions"><button class="btn ghost sm" id="btn-reset-progress" title="Убрать все отметки «решено» и сохранённые ответы">🔄 Сбросить прогресс</button></div>
      <div id="topics-grid" class="topics-grid"></div>
    </section>

    <section id="view-topic" class="view hidden">
      <div class="topic-header">
        <button class="btn ghost" id="btn-back-home">← Все темы</button>
        <h1 id="topic-title" class="page-title"></h1>
        <p id="topic-description" class="page-subtitle"></p>
        <div id="topic-progress" class="topic-progress"></div>
        <div class="topic-actions">
          <button class="btn" id="btn-theory">📖 Теория</button>
          <button class="btn" id="btn-shuffle">🎲 Перемешать</button>
        </div>
      </div>
      <div id="topic-filters" class="filters"></div>
      <div id="task-list" class="task-list"></div>
    </section>

    <section id="view-task" class="view hidden">
      <div class="task-nav">
        <button class="btn ghost" id="btn-back-topic">← К списку задач</button>
        <button class="btn ghost" id="btn-theory-task">📖 Теория</button>
        <button class="btn ghost" id="btn-shuffle-task">🎲 Другая задача</button>
        <button class="btn ghost" id="btn-next-task">Следующая задача →</button>
      </div>
      <div class="task-layout">
        <div class="task-left">
          <div class="task-card">
            <div class="task-meta">
              <span class="badge" id="task-difficulty"></span>
              <span class="badge diff-topic" id="task-topic-label"></span>
              <span class="task-status" id="task-status"></span>
            </div>
            <h2 id="task-title" class="task-title"></h2>
            <div id="task-question" class="task-description"></div>
            <div class="play-area" id="play-area"></div>
            <div class="hints-block" id="hints-block"></div>
            <div class="card-actions">
              <button class="btn ghost sm" id="btn-hint">💡 Показать подсказку</button>
            </div>
          </div>
          <div class="results-card hidden" id="results-card">
            <div id="results-summary" class="results-summary"></div>
            <div id="results-list" class="results-list"></div>
          </div>
        </div>
        <div class="task-right">
          <div class="answer-toolbar">
            <span class="answer-label" id="answer-label">Ваш ответ</span>
            <button class="btn ghost sm" id="btn-reset">↺ Сбросить</button>
          </div>
          <div id="answer-area" class="answer-area"></div>
          <div class="editor-actions">
            <button class="btn primary" id="btn-check">✓ Проверить</button>
            <button class="btn ghost" id="btn-solution">📖 Показать решение</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal">
      <h3 id="modal-title"></h3>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">Отмена</button>
        <button class="btn primary" id="modal-ok">Да</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="theory-backdrop">
    <div class="modal modal-wide">
      <div class="theory-head">
        <span id="theory-topic-icon" class="theory-icon"></span>
        <h2 id="theory-topic-title" class="theory-title"></h2>
        <button class="btn ghost sm" id="theory-close">✕ Закрыть</button>
      </div>
      <div class="theory-content" id="theory-content"></div>
      <div class="theory-footer">
        <button class="btn primary" id="theory-start">Перейти к задачам →</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">🎸 Учите музыкальную теорию и прокачивайте слух</footer>

  <script src="js/data/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data/t01-notes.js"></script>
  <script src="js/data/t02-intervals.js"></script>
  <script src="js/data/t03-major.js"></script>
  <script src="js/data/t04-minor.js"></script>
  <script src="js/data/t05-triads.js"></script>
  <script src="js/data/t06-sevenths.js"></script>
  <script src="js/data/t07-chords.js"></script>
  <script src="js/data/t08-pentatonic.js"></script>
  <script src="js/data/t09-circle.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/app.js"></script>
  <script src="js/selftest.js"></script>
</body>
</html>
